name: Sync from upstream

on:
  schedule:
    # Weekly, Mondays at 06:00 UTC. Adjust to taste.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/floci-io/floci.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: sync/upstream-main
  # Files we never want to inherit from upstream. The Conventional Commits
  # workflow rejects upstream's own `Release X.Y.Z` semantic-release commits
  # whenever a sync PR replays them, so keeping it out of this fork lets every
  # sync PR pass cleanly.
  EXCLUDE_PATHS: |
    .github/workflows/conventional-commits.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" origin/main; then
            echo "Already up to date with upstream; nothing to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push sync branch
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH" "upstream/$UPSTREAM_BRANCH"

          removed=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git rm -f "$path"
              removed+=("$path")
            fi
          done <<< "$EXCLUDE_PATHS"

          if [ ${#removed[@]} -gt 0 ]; then
            git commit -m "ci: exclude upstream files not used in this fork

          ${removed[*]}"
          fi

          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"

      - name: Open or update pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
        run: |
          open_count=$(gh pr list --repo "$REPO" --head "$SYNC_BRANCH" --state open --json number --jq 'length')
          if [ "$open_count" -gt 0 ]; then
            echo "Sync PR already open; its head now points at upstream $UPSTREAM_SHA."
            exit 0
          fi
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "Sync with upstream floci-io/floci ($UPSTREAM_SHA)" \
            --body "$(cat <<'EOF'
          Automated sync of new commits from [`floci-io/floci`](https://github.com/floci-io/floci) (`main`).

          The diff shows everything added upstream since this fork last shared history
          with it, plus a trailing commit removing files this fork chooses not to inherit.

          **Merge with a merge commit (not squash or rebase)** so that upstream `main`
          becomes a real ancestor of this fork's `main`. That lets the next scheduled run
          detect the fork is up to date instead of re-opening an identical PR.

          Resolve any merge conflicts via the GitHub UI or locally before merging.
          EOF
          )"
